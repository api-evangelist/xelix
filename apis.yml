aid: xelix
name: Xelix
description: 'Xelix is a London-based company (with a US office in Wilmington, DE)
  providing an AI-powered Accounts Payable control platform that bolts onto existing
  ERP, P2P, and email systems. Its five modules — Transactions (duplicate/incorrect
  payment and fraud prevention), Statements (supplier statement reconciliation),
  Helpdesk (generative-AI vendor query resolution), Vendors (master vendor data
  cleansing), and Reports — process 115M+ invoices annually for 200+ global customers.
  Backed by Insight Partners ($160M raised July 2025 to advance agentic AI in AP).
  Xelix is ISO 27001 and SOC 2 certified, GDPR compliant, hosted on AWS (EU/US/UK
  data residency), and publishes a Vanta trust center and an UptimeRobot status page.
  Integration is file-based (daily SFTP transfer of invoice, workflow, and master
  vendor data) plus optional SSO and email integrations; the company publishes no
  public developer portal or documented API surface, though its platform runs on
  api.xelix.com and its engineering team maintains open-source Python/Rust packages
  on GitHub (xelixdev).'
